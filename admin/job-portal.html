<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Job Portal | VITC Admin</title><link rel="stylesheet" href="assets/admin.css?v=p6"></head>
<body><script src="assets/admin.js?v=p8"></script><script>
(async function () {
  var mount = Admin.renderShell('job-portal', 'Job Portal'); if (!mount) return;
  var fields = [
    ['jobTitle','Job title','text',true], ['companyName','Company name','text',true], ['location','Location','text',false], ['employmentType','Employment type','text',false],
    ['experience','Experience','text',false], ['qualification','Qualification','text',false], ['salaryCtc','Salary / CTC','text',false], ['openings','Number of openings','number',false],
    ['applicationDeadline','Application deadline','date',false], ['applicationMethod','Application method','text',false], ['requiredSkills','Required skills','text',true], ['description','Description','textarea',true]
  ];
  mount.innerHTML = '<div class="jp-sections"><div class="card"><h3>Job Requirements</h3><div id="jobs" class="jp-list">Loading...</div></div><div class="card"><h3>Employer Enquiries</h3><div id="enquiries" class="jp-list">Loading...</div></div></div><div style="margin-top:16px"><button class="btn btn-primary" id="newJob">+ New Job Requirement</button></div>';
  function esc(v) { return Admin.esc(v); }
  function formHtml(data) { return fields.map(function (f) { var v = data && data[f[0]] != null ? data[f[0]] : ''; return '<div class="field"><label>' + esc(f[1]) + (f[3] ? ' *' : '') + '</label>' + (f[2] === 'textarea' ? '<textarea name="' + f[0] + '"' + (f[3] ? ' required' : '') + '>' + esc(v) + '</textarea>' : '<input name="' + f[0] + '" type="' + f[2] + '" value="' + esc(v) + '"' + (f[3] ? ' required' : '') + '>') + '</div>'; }).join('') + '<label class="field checkline"><input type="checkbox" name="published" ' + (data && data.published ? 'checked' : '') + '> Published</label>'; }
  function editJob(record, enquiry) { var data = record || { companyName: enquiry.companyName, jobTitle: enquiry.jobTitle, openings: enquiry.openings, requiredSkills: enquiry.requiredSkills, experience: enquiry.experienceRequired, location: enquiry.location, description: enquiry.message, published: false }; var modal = Admin.openModal(record ? 'Edit Job' : 'Create Job Requirement', formHtml(data), async function (m, close) { var payload = {}; new FormData(m.querySelector('form')).forEach(function (v, k) { payload[k] = v; }); payload.published = m.querySelector('[name="published"]').checked; if (payload.openings === '') payload.openings = null; if (payload.applicationDeadline === '') payload.applicationDeadline = null; await Admin.api[record ? 'put' : 'post'](record ? '/admin/jobs/' + record.id : '/admin/jobs', payload); Admin.toast('Job saved', 'ok'); close(); load(); }); }
  function enquiryDetails(e) { return '<div class="field"><label>Company / contact</label><div>' + esc(e.companyName) + ' · ' + esc(e.contactPerson) + '</div></div><div class="field"><label>Email / phone</label><div>' + esc(e.email) + ' · ' + esc(e.phone) + '</div></div><div class="field"><label>Job / openings</label><div>' + esc(e.jobTitle) + ' · ' + esc(e.openings || 'Not specified') + '</div></div><div class="field"><label>Skills / experience</label><div>' + esc(e.requiredSkills || '—') + ' · ' + esc(e.experienceRequired || '—') + '</div></div><div class="field"><label>Location</label><div>' + esc(e.location || '—') + '</div></div><div class="field"><label>Message</label><div>' + esc(e.message) + '</div></div><div class="field"><label>Submitted</label><div>' + Admin.date(e.submittedAt) + '</div></div>'; }
  async function load() { var jobs = await Admin.api.get('/admin/jobs'); document.getElementById('jobs').innerHTML = jobs.length ? jobs.map(function (j) { return '<div class="jp-item"><div class="jp-item-main"><div class="jp-title">' + esc(j.jobTitle) + '</div><div class="jp-sub muted">' + esc(j.companyName) + '</div></div><div class="jp-status">' + Admin.statusBadge(j.published ? 'PUBLISHED' : 'DRAFT') + '</div><div class="jp-actions"><button class="btn btn-sm" data-edit="' + j.id + '">Edit</button><button class="btn btn-sm" data-toggle="' + j.id + '">' + (j.published ? 'Unpublish' : 'Publish') + '</button><button class="btn btn-sm btn-danger" data-delete="' + j.id + '">Delete</button></div></div>'; }).join('') : '<p class="muted">No job requirements yet.</p>'; jobs.forEach(function (j) { document.querySelector('[data-edit="' + j.id + '"]').onclick = function () { editJob(j); }; document.querySelector('[data-toggle="' + j.id + '"]').onclick = async function () { try { await Admin.api.put('/admin/jobs/' + j.id, Object.assign({}, j, { published: !j.published })); load(); } catch (e) { Admin.toast(e.message, 'err'); } }; document.querySelector('[data-delete="' + j.id + '"]').onclick = function () { Admin.confirmDelete(j.jobTitle, async function () { await Admin.api.del('/admin/jobs/' + j.id); Admin.toast('Job deleted', 'ok'); load(); }); }; }); var enquiries = await Admin.api.get('/admin/employer-enquiries'); document.getElementById('enquiries').innerHTML = enquiries.length ? enquiries.map(function (e) { return '<div class="jp-item"><div class="jp-item-main"><div class="jp-title">' + esc(e.companyName) + '</div><div class="jp-sub muted">' + esc(e.jobTitle) + '</div></div><div class="jp-status">' + Admin.statusBadge(e.status) + '</div><div class="jp-actions"><button class="btn btn-sm" data-view="' + e.id + '">View Details</button><button class="btn btn-sm btn-primary" data-create="' + e.id + '">Create Job</button></div></div>'; }).join('') : '<p class="muted">No enquiries yet.</p>'; enquiries.forEach(function (e) { document.querySelector('[data-view="' + e.id + '"]').onclick = function () { Admin.openModal('Employer Enquiry', enquiryDetails(e), function (m, close) { close(); }, 'Close'); }; document.querySelector('[data-create="' + e.id + '"]').onclick = function () { editJob(null, e); }; }); }
  document.getElementById('newJob').onclick = function () { editJob(null, {}); }; load().catch(function (e) { Admin.toast(e.message, 'err'); });
})();
</script></body></html>
