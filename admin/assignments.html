<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<title>Assignments — VITC Admin</title>
<link rel="stylesheet" href="assets/admin.css?v=p5">
</head>
<body>
<script src="assets/admin.js?v=p8"></script>
<script>
Admin.crudPage({
  key: 'assignments',
  title: 'Manage Assignments',
  singular: 'Assignment',
  endpoint: '/assignments',
  searchKeys: ['code', 'title', 'category', 'tech', 'difficulty'],
  labelOf: function (r) { return r.title; },
  columns: [
    { label: 'Code', key: 'code' },
    { label: 'Title', key: 'title' },
    { label: 'Tech', key: 'tech' },
    { label: 'Difficulty', key: 'difficulty' },
    { label: 'Delivery', render: function (r) { return Admin.esc(r.deliveryDays || '—'); } },
    { label: 'Price', render: function (r) { return Admin.money(r.price); } },
    { label: 'Status', render: function (r) { return Admin.boolBadge(r.active, 'Active', 'Hidden'); } }
  ],
  rowActions: [{
    label: function (r) { return r.active ? 'Hide' : 'Publish'; },
    onClick: async function (r, reload) {
      await Admin.api.put('/assignments/' + r.id, {
        code: r.code, title: r.title, description: r.description, price: r.price, tech: r.tech,
        difficulty: r.difficulty, deliveryDays: r.deliveryDays, category: r.category,
        icon: r.icon, features: r.features, active: !r.active
      });
      Admin.toast('Status updated', 'ok');
      reload();
    }
  }],
  fields: [
    { name: 'code', label: 'Assignment code', required: true, half: true, placeholder: 'ASG-JAVA-01' },
    { name: 'title', label: 'Title', required: true, half: true },
    { name: 'description', label: 'Description', type: 'textarea' },
    { name: 'price', label: 'Price (₹)', type: 'number', step: '0.01', min: 0, required: true, half: true },
    { name: 'deliveryDays', label: 'Delivery time', half: true, placeholder: '3 days' },
    { name: 'tech', label: 'Technology', half: true, placeholder: 'Java, Spring Boot' },
    { name: 'difficulty', label: 'Difficulty', type: 'select', allowEmpty: true, half: true,
      options: ['Easy', 'Medium', 'Hard'] },
    { name: 'category', label: 'Category', half: true },
    { name: 'icon', label: 'Icon (emoji or short code)', half: true, placeholder: '💻' },
    { name: 'features', label: 'Features (one per line)', type: 'textarea' },
    { name: 'active', label: 'Active (visible on website)', type: 'checkbox', default: true }
  ]
});
</script>
</body>
</html>
