<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<title>Courses — VITC Admin</title>
<link rel="stylesheet" href="assets/admin.css?v=p5">
</head>
<body>
<script src="assets/admin.js?v=p8"></script>
<script>
Admin.crudPage({
  key: 'courses',
  title: 'Manage Courses',
  singular: 'Course',
  endpoint: '/courses',
  searchKeys: ['code', 'title', 'category', 'level'],
  labelOf: function (r) { return r.title; },
  columns: [
    { label: 'Code', key: 'code' },
    { label: 'Title', key: 'title' },
    { label: 'Category', key: 'category' },
    { label: 'Level', key: 'level' },
    { label: 'Duration', render: function (r) { return Admin.esc(r.durationMonths || '—'); } },
    { label: 'Price', render: function (r) { return Admin.money(r.price); } },
    { label: 'Status', render: function (r) { return Admin.boolBadge(r.active, 'Active', 'Hidden'); } }
  ],
  rowActions: [{
    label: function (r) { return r.active ? 'Hide' : 'Publish'; },
    onClick: async function (r, reload) {
      await Admin.api.put('/courses/' + r.id, {
        code: r.code, title: r.title, description: r.description, price: r.price, meta: r.meta,
        level: r.level, category: r.category, durationMonths: r.durationMonths, active: !r.active
      });
      Admin.toast('Status updated', 'ok');
      reload();
    }
  }],
  fields: [
    { name: 'code', label: 'Course code', required: true, half: true, placeholder: 'JAVA-FS' },
    { name: 'title', label: 'Title', required: true, half: true },
    { name: 'description', label: 'Description', type: 'textarea' },
    { name: 'price', label: 'Price (₹)', type: 'number', step: '0.01', min: 0, required: true, half: true },
    { name: 'durationMonths', label: 'Duration', half: true, placeholder: '6 months' },
    { name: 'level', label: 'Level', type: 'select', allowEmpty: true, half: true,
      options: ['Beginner', 'Intermediate', 'Advanced'] },
    { name: 'category', label: 'Category', half: true, placeholder: 'Development' },
    { name: 'meta', label: 'Meta / short tagline' },
    { name: 'active', label: 'Active (visible on website)', type: 'checkbox', default: true }
  ]
});
</script>
</body>
</html>
