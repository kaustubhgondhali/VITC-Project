<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<title>Teachers — VITC Admin</title>
<link rel="stylesheet" href="assets/admin.css?v=p5">
<style>
  .tk { display:flex; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .tk:last-child { border-bottom:0; }
  .tk b { min-width:160px; display:inline-block; font-weight:600; }
  .tc-list { margin-top:6px; }
  .tc-row { display:flex; justify-content:space-between; align-items:center; gap:10px;
            border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:8px; }
  .tc-pick { display:block; padding:7px 2px; font-size:14px; }
  .tc-pick input { margin-right:8px; }
  .cred { background:#0f172a; color:#e2e8f0; border-radius:10px; padding:12px 14px; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<script src="assets/admin.js?v=p8"></script>
<script>
(function () {
  var esc = Admin.esc;

  /* ---------------------------------------------------------------- helpers */

  function showCredentials(title, c) {
    Admin.openModal(title,
      '<p class="muted">Hand these credentials to the teacher now — the password is shown only once and is ' +
      'stored on the server as a BCrypt hash only.</p>' +
      '<div class="cred">Username: ' + esc(c.username) + '<br>Password: ' + esc(c.temporaryPassword) + '</div>' +
      '<p class="muted" style="font-size:12px;margin-top:10px">The teacher must change this password at first login.</p>',
      async function (m, close) { close(); }, 'Done');
  }

  function courseRow(teacher, c, reload) {
    return '<div class="tc-row"><div><strong>' + esc(c.title) + '</strong>' +
      '<div class="muted" style="font-size:12px"><code>' + esc(c.code || '') + '</code>' +
      (c.category ? ' · ' + esc(c.category) : '') + '</div></div>' +
      '<button type="button" class="btn btn-sm btn-danger" data-remove="' + c.id + '">Remove</button></div>';
  }

  function detailHtml(t) {
    var courses = (t.assignedCourses || []).length
      ? t.assignedCourses.map(function (c) { return courseRow(t, c); }).join('')
      : '<div class="muted">No courses assigned yet — this teacher currently has access to nothing.</div>';
    return '<div class="tk"><b>Username</b><span><code>' + esc(t.username || '—') + '</code></span></div>' +
      '<div class="tk"><b>Name</b><span>' + esc(t.fullName || '—') + '</span></div>' +
      '<div class="tk"><b>Email</b><span>' + esc(t.email || '—') + '</span></div>' +
      '<div class="tk"><b>Phone</b><span>' + esc(t.phone || '—') + '</span></div>' +
      '<div class="tk"><b>Status</b><span>' + Admin.statusBadge(t.status) + '</span></div>' +
      '<div class="tk"><b>Temp password in use</b><span>' + (t.mustChangePassword ? 'Yes' : 'No') + '</span></div>' +
      '<div class="tk"><b>Last login</b><span>' + Admin.date(t.lastLoginAt) + '</span></div>' +
      '<div class="tk"><b>Created</b><span>' + Admin.date(t.createdAt) + '</span></div>' +
      '<h4 style="margin:16px 0 8px">Assigned courses (' + (t.assignedCourseCount || 0) + ')</h4>' +
      '<div class="tc-list">' + courses + '</div>' +
      '<p class="muted" style="font-size:12px">Removing an assignment only withdraws access. Modules, lessons, ' +
      'videos and all historical records created by the teacher are preserved.</p>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button type="button" class="btn btn-sm" id="assignBtn">Assign courses</button>' +
        '<button type="button" class="btn btn-sm" id="resetBtn">Reset password</button>' +
      '</div>';
  }

  /* --------------------------------------------------------------- actions */

  async function assignCourses(teacher, reload) {
    var all = await Admin.api.get('/admin/teachers/courses');
    var assignedIds = (teacher.assignedCourses || []).map(function (c) { return c.id; });
    var options = (all || []).map(function (c) {
      var mine = assignedIds.indexOf(c.id) >= 0;
      var takenBy = (!mine && c.assignedTeacherId) ? c.assignedTeacherName : null;
      return '<label class="tc-pick"><input type="checkbox" value="' + c.id + '"' +
        (mine ? ' checked' : '') + (takenBy ? ' disabled' : '') + '>' + esc(c.title) +
        ' <span class="muted" style="font-size:12px">' + esc(c.code || '') +
        (takenBy ? ' — assigned to ' + esc(takenBy) : '') + '</span></label>';
    }).join('');
    Admin.openModal('Assign courses to ' + (teacher.fullName || teacher.username),
      '<p class="muted" style="font-size:13px">Ticked courses are the complete set this teacher may access. ' +
      'Un-ticking a course removes access only — content is kept.</p>' +
      '<div style="max-height:320px;overflow:auto">' + (options || '<div class="muted">No courses exist yet.</div>') + '</div>',
      async function (m, close) {
        var ids = Array.prototype.slice.call(m.querySelectorAll('input[type=checkbox]'))
          .filter(function (i) { return i.checked && !i.disabled; })
          .map(function (i) { return Number(i.value); });
        await Admin.api.put('/admin/teachers/' + teacher.id + '/courses', { courseIds: ids });
        Admin.toast('Course assignments updated', 'ok');
        close();
        if (reload) reload();
      }, 'Save assignments');
  }

  function resetPassword(teacher, reload) {
    Admin.openModal('Reset password — ' + (teacher.username || teacher.fullName),
      '<div class="field"><label for="rpPwd">New password</label>' +
      '<input id="rpPwd" type="text" minlength="8" placeholder="Leave blank to generate a strong password"></div>' +
      '<p class="muted" style="font-size:12px">Only the BCrypt hash is stored. Any active teacher session is ' +
      'terminated and the teacher must change the password at next login.</p>',
      async function (m, close) {
        var pwd = m.querySelector('#rpPwd').value.trim();
        var c = await Admin.api.post('/admin/teachers/' + teacher.id + '/password-reset',
          pwd ? { newPassword: pwd } : {});
        close();
        showCredentials('Password reset', c);
        if (reload) reload();
      }, 'Reset password');
  }

  async function view(row, reload) {
    var t = await Admin.api.get('/admin/teachers/' + row.id);
    var modal = Admin.openModal('Teacher Details', detailHtml(t),
      async function (m, close) { close(); }, 'Close');
    modal.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        try {
          await Admin.api.del('/admin/teachers/' + t.id + '/courses/' + btn.getAttribute('data-remove'));
          Admin.toast('Course assignment removed', 'ok');
          if (reload) reload();
          view(row, reload);
        } catch (e) { Admin.toast(e.message, 'err'); }
      });
    });
    modal.querySelector('#assignBtn').addEventListener('click', function () { assignCourses(t, reload); });
    modal.querySelector('#resetBtn').addEventListener('click', function () { resetPassword(t, reload); });
  }

  function addTeacher(reload) {
    Admin.openModal('Add Teacher',
      '<div class="field-row"><div class="field"><label for="ntName">Full name *</label>' +
        '<input id="ntName" type="text" required></div>' +
      '<div class="field"><label for="ntUser">Login username *</label>' +
        '<input id="ntUser" type="text" required minlength="4" placeholder="e.g. VITCteacher2"></div></div>' +
      '<div class="field-row"><div class="field"><label for="ntEmail">Email *</label>' +
        '<input id="ntEmail" type="email" required></div>' +
      '<div class="field"><label for="ntPhone">Phone</label><input id="ntPhone" type="text"></div></div>' +
      '<div class="field"><label for="ntPwd">Temporary password</label>' +
        '<input id="ntPwd" type="text" minlength="8" placeholder="Leave blank to generate one"></div>' +
      '<p class="muted" style="font-size:12px">The account is created ACTIVE. Assign courses afterwards — until then ' +
      'the teacher can sign in but has access to no course.</p>',
      async function (m, close) {
        var body = {
          fullName: m.querySelector('#ntName').value.trim(),
          username: m.querySelector('#ntUser').value.trim(),
          email: m.querySelector('#ntEmail').value.trim(),
          phone: m.querySelector('#ntPhone').value.trim() || null
        };
        var pwd = m.querySelector('#ntPwd').value.trim();
        if (pwd) body.password = pwd;
        if (!body.fullName || !body.username || !body.email) throw new Error('Name, username and email are required');
        var c = await Admin.api.post('/admin/teachers', body);
        close();
        showCredentials('Teacher created', c);
        if (reload) reload();
      }, 'Create teacher');
  }

  function editTeacher(row, reload) {
    Admin.openModal('Edit Teacher',
      '<div class="field"><label for="etName">Full name *</label>' +
        '<input id="etName" type="text" required value="' + esc(row.fullName || '') + '"></div>' +
      '<div class="field-row"><div class="field"><label for="etEmail">Email *</label>' +
        '<input id="etEmail" type="email" required value="' + esc(row.email || '') + '"></div>' +
      '<div class="field"><label for="etPhone">Phone</label>' +
        '<input id="etPhone" type="text" value="' + esc(row.phone || '') + '"></div></div>' +
      '<p class="muted" style="font-size:12px">Login username cannot be changed. Use “Reset password” to issue new ' +
      'credentials.</p>',
      async function (m, close) {
        await Admin.api.put('/admin/teachers/' + row.id, {
          fullName: m.querySelector('#etName').value.trim(),
          email: m.querySelector('#etEmail').value.trim(),
          phone: m.querySelector('#etPhone').value.trim() || null
        });
        Admin.toast('Teacher updated', 'ok');
        close();
        if (reload) reload();
      }, 'Save changes');
  }

  /* ------------------------------------------------------------------ page */

  var page = Admin.crudPage({
    key: 'teachers',
    title: 'Teachers',
    singular: 'Teacher',
    endpoint: '/admin/teachers',
    canCreate: true,
    createLabel: 'Add Teacher',
    canEdit: false,
    canDelete: false,
    onCreate: function (reload) { addTeacher(reload); },
    emptyText: 'No teacher accounts yet. Use “Add Teacher” to create one.',
    searchKeys: ['username', 'fullName', 'email', 'phone', 'status'],
    columns: [
      { label: 'Username', render: function (r) { return '<code>' + esc(r.username || '—') + '</code>'; } },
      { label: 'Name', render: function (r) { return esc(r.fullName || '—'); } },
      { label: 'Email', render: function (r) { return esc(r.email || '—'); } },
      { label: 'Assigned Courses', render: function (r) {
          if (!r.assignedCourses || !r.assignedCourses.length) return '<span class="muted">— none —</span>';
          return r.assignedCourses.map(function (c) {
            return '<span class="badge badge-info">' + esc(c.title) + '</span>';
          }).join(' ');
        } },
      { label: 'Status', render: function (r) { return Admin.statusBadge(r.status); } },
      { label: 'Last login', render: function (r) { return Admin.date(r.lastLoginAt); } }
    ],
    rowActions: [
      { label: 'View', onClick: function (r, reload) { return view(r, reload); } },
      { label: 'Edit', onClick: function (r, reload) { editTeacher(r, reload); } },
      { label: 'Courses', onClick: async function (r, reload) {
          var t = await Admin.api.get('/admin/teachers/' + r.id);
          assignCourses(t, reload);
        } },
      { label: 'Reset password', onClick: function (r, reload) { resetPassword(r, reload); } },
      { label: function (r) { return r.status === 'ACTIVE' ? 'Deactivate' : 'Activate'; },
        className: 'btn-danger',
        onClick: async function (r, reload) {
          var next = r.status === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
          await Admin.api.patch('/admin/teachers/' + r.id + '/status?status=' + next, undefined);
          Admin.toast(next === 'INACTIVE'
            ? 'Teacher deactivated — login and all teacher APIs are now denied'
            : 'Teacher activated', 'ok');
          reload();
        } }
    ]
  });

  // "+ Add Teacher" opens the custom dialog (the generic field form cannot show the
  // one-time credentials), so the default handler is replaced here.
  if (page) {
    var addBtn = page.mount.querySelector('#addBtn');
    if (addBtn) {
      var clone = addBtn.cloneNode(true);
      addBtn.parentNode.replaceChild(clone, addBtn);
      clone.addEventListener('click', function () { addTeacher(page.reload); });
    }
  }
})();
</script>
</body>
</html>
