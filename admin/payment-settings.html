<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<title>Payment Settings — VITC Admin</title>
<link rel="stylesheet" href="assets/admin.css?v=p5">
<style>
  .ps-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); align-items: start; }
  @media (max-width: 900px) { .ps-grid { grid-template-columns: 1fr; } }
  .ps-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .ps-card h3 { margin: 0 0 4px; font-size: 16px; }
  .ps-card .muted { margin-bottom: 16px; display: block; }
  .ps-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .ps-row > .field { flex: 1 1 220px; }
  .ps-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .ps-kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
  .ps-kv:last-child { border-bottom: 0; }
  .ps-hidden { display: none; }
  code.ps-url { word-break: break-all; font-size: 12px; }
</style>
</head>
<body>
<script src="assets/admin.js?v=p8"></script>
<script>
(function () {
  var mount = Admin.renderShell('payment-settings', 'Payment Settings');
  if (!mount) return;
  var esc = Admin.esc;
  var state = null;

  mount.innerHTML =
    '<div class="ps-grid">' +
      '<div class="ps-card">' +
        '<h3>Payment gateway</h3>' +
        '<span class="muted">Credentials are stored encrypted on the server and are never sent back to the browser.</span>' +
        '<form id="psForm">' +
          '<div class="ps-row">' +
            '<div class="field"><label for="gateway">Gateway</label>' +
              '<select id="gateway"><option value="MOCK">Mock (simulated checkout)</option>' +
              '<option value="RAZORPAY">Razorpay</option></select></div>' +
            '<div class="field"><label for="mode">Mode</label>' +
              '<select id="mode"><option value="TEST">Test</option><option value="LIVE">Live</option></select></div>' +
          '</div>' +
          '<div id="rzpFields">' +
            '<div class="field"><label for="keyId">Razorpay Key ID</label>' +
              '<input id="keyId" type="text" autocomplete="off" placeholder="rzp_test_xxxxxxxxxxxx"></div>' +
            '<div class="field"><label for="keySecret">Razorpay Key Secret</label>' +
              '<input id="keySecret" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved secret">' +
              '<small class="muted" id="secretHint"></small></div>' +
            '<div class="field"><label for="webhookSecret">Webhook Secret (optional)</label>' +
              '<input id="webhookSecret" type="password" autocomplete="new-password" placeholder="Leave blank to keep the saved secret"></div>' +
            '<div class="field"><label for="enabled">Enable Razorpay for live checkout</label>' +
              '<select id="enabled"><option value="false">Disabled (use mock checkout)</option>' +
              '<option value="true">Enabled</option></select></div>' +
          '</div>' +
          '<div class="ps-actions">' +
            '<button class="btn btn-primary" type="submit" id="saveBtn">Save settings</button>' +
            '<button class="btn" type="button" id="testBtn">Test connection</button>' +
            '<button class="btn" type="button" id="toggleBtn"></button>' +
          '</div>' +
        '</form>' +
      '</div>' +
      '<div class="ps-card">' +
        '<h3>Status</h3><span class="muted">Live configuration currently used by checkout.</span>' +
        '<div id="statusBox">Loading…</div>' +
        '<h3 style="margin-top:18px">Webhook URL</h3>' +
        '<code class="ps-url" id="hookUrl"></code>' +
        '<p class="muted" style="margin-top:10px;font-size:12px">Add this URL in your Razorpay Dashboard → Settings → Webhooks for the events <strong>payment.captured</strong> and <strong>order.paid</strong>, using the same webhook secret saved here.</p>' +
      '</div>' +
    '</div>';

  var $ = function (id) { return mount.querySelector('#' + id); };
  $('hookUrl').textContent = Admin.API_BASE + '/api/v1/payment/razorpay/webhook';

  function syncFields() {
    $('rzpFields').className = $('gateway').value === 'RAZORPAY' ? '' : 'ps-hidden';
  }
  $('gateway').addEventListener('change', syncFields);

  function badge(status) {
    var map = {
      ENABLED: 'badge-success', CONNECTED: 'badge-info', DISABLED: 'badge-warning',
      NOT_CONFIGURED: 'badge-warning', CONNECTION_FAILED: 'badge-danger', MOCK_GATEWAY: 'badge-info'
    };
    return '<span class="badge ' + (map[status] || 'badge-info') + '">' + esc(String(status).replace(/_/g, ' ')) + '</span>';
  }

  function render(s) {
    state = s;
    $('gateway').value = s.gateway;
    $('mode').value = s.mode;
    $('keyId').value = s.keyId || '';
    $('keySecret').value = '';
    $('webhookSecret').value = '';
    $('enabled').value = s.enabled ? 'true' : 'false';
    $('secretHint').textContent = s.configured
      ? 'A secret is already saved (' + s.maskedKeySecret + '). Leave blank to keep it.'
      : 'Required the first time you configure Razorpay.';
    $('toggleBtn').textContent = s.enabled ? 'Disable Razorpay' : 'Enable Razorpay';
    $('toggleBtn').style.display = s.gateway === 'RAZORPAY' ? '' : 'none';
    $('statusBox').innerHTML =
      '<div class="ps-kv"><span>Status</span><span>' + badge(s.status) + '</span></div>' +
      '<div class="ps-kv"><span>Gateway</span><span>' + esc(s.gateway) + '</span></div>' +
      '<div class="ps-kv"><span>Mode</span><span>' + esc(s.mode) + '</span></div>' +
      '<div class="ps-kv"><span>Key ID</span><span>' + esc(s.keyId || '—') + '</span></div>' +
      '<div class="ps-kv"><span>Key Secret</span><span>' + esc(s.maskedKeySecret || '—') + '</span></div>' +
      '<div class="ps-kv"><span>Webhook secret</span><span>' + (s.webhookSecretConfigured ? 'Saved' : 'Not set') + '</span></div>' +
      '<div class="ps-kv"><span>Last test</span><span>' + esc(s.lastTestStatus || 'Never') + '</span></div>' +
      (s.lastTestMessage ? '<div class="muted" style="font-size:12px;margin-top:6px">' + esc(s.lastTestMessage) + '</div>' : '') +
      '<div class="ps-kv"><span>Updated</span><span>' + (s.updatedAt ? Admin.date(s.updatedAt) : '—') + '</span></div>';
    syncFields();
  }

  async function load() {
    try { render(await Admin.api.get('/admin/payment-settings')); }
    catch (e) { $('statusBox').textContent = e.message; Admin.toast(e.message, 'err'); }
  }

  $('psForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = $('saveBtn');
    btn.disabled = true;
    try {
      render(await Admin.api.put('/admin/payment-settings', {
        gateway: $('gateway').value,
        mode: $('mode').value,
        keyId: $('keyId').value.trim() || null,
        keySecret: $('keySecret').value.trim() || null,
        webhookSecret: $('webhookSecret').value.trim() || null,
        enabled: $('enabled').value === 'true'
      }));
      Admin.toast('Payment settings saved', 'ok');
    } catch (err) { Admin.toast(err.message, 'err'); }
    btn.disabled = false;
  });

  $('testBtn').addEventListener('click', async function () {
    var btn = $('testBtn');
    btn.disabled = true;
    try {
      var r = await Admin.api.post('/admin/payment-settings/test', {});
      Admin.toast(r.message, r.success ? 'ok' : 'err');
    } catch (err) { Admin.toast(err.message, 'err'); }
    btn.disabled = false;
    load();
  });

  $('toggleBtn').addEventListener('click', async function () {
    var btn = $('toggleBtn');
    btn.disabled = true;
    try {
      var next = state && state.enabled ? 'disable' : 'enable';
      render(await Admin.api.post('/admin/payment-settings/' + next, {}));
      Admin.toast('Razorpay ' + next + 'd', 'ok');
    } catch (err) { Admin.toast(err.message, 'err'); }
    btn.disabled = false;
  });

  load();
})();
</script>
</body>
</html>
