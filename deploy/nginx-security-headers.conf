# PART 2B-1/7 - security headers for the STATIC VITC frontend (HTML/CSS/JS/images).
# The Spring Boot backend sets its own copies for /api/** and /uploads/** responses.
#
# Usage: include this file inside the server{} block that serves the site, e.g.
#   include /etc/nginx/snippets/nginx-security-headers.conf;
# Replace API_ORIGIN below with the backend origin (e.g. https://api.vandanaitcourse.com).
# If the API is on the SAME origin as the site, delete the API_ORIGIN token entirely.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self)" always;

# HSTS: only enable on the HTTPS server block. Never add it to a plain-HTTP vhost
# and never on a local development server.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com 'unsafe-inline'; script-src-elem 'self' https://checkout.razorpay.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; style-src-elem 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: blob: API_ORIGIN https://images.unsplash.com https://www.gstatic.com https://*.razorpay.com https://i.ytimg.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' API_ORIGIN https://api.razorpay.com https://lumberjack.razorpay.com https://*.razorpay.com; media-src 'self' blob: data: API_ORIGIN; frame-src 'self' API_ORIGIN https://api.razorpay.com https://checkout.razorpay.com https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
