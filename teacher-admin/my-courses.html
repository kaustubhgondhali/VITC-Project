<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>My Courses — VITC Teacher Admin</title>
<link rel="stylesheet" href="../admin/assets/admin.css">
<link rel="stylesheet" href="assets/teacher.css?v=p5">
<style>
  .mc-grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  /* PART 7/8 — on the narrowest phones (e.g. 320px CSS width) a 300px minimum column plus the
     24px page padding on each side no longer fits, which forces horizontal scrolling. Below
     480px a single full-width column is always safe instead. */
  @media (max-width:480px) {
    .mc-grid { grid-template-columns:1fr; }
  }
  .mc-card { display:flex; flex-direction:column; gap:10px; }
  .mc-head { display:flex; gap:12px; align-items:flex-start; }
  .mc-icon { width:44px; height:44px; flex:0 0 44px; border-radius:12px; display:grid; place-items:center;
    font-size:20px; background:var(--surface-2); }
  .mc-title { font-weight:700; font-size:15px; line-height:1.3; }
  .mc-code { color:var(--muted); font-size:12px; margin-top:2px; }
  .mc-meta { color:var(--muted); font-size:13px; }
  .mc-stats { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  .mc-stats strong { color:var(--text); font-weight:700; }
  .mc-updated { font-size:12px; color:var(--muted); }
  .mc-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
</style>
</head>
<body>
<div class="layout">
  <a class="t-skip-link" href="#mainContent">Skip to main content</a>
  <aside class="sidebar" id="teacherSidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="burger" id="burger" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="teacherSidebar">☰</button>
        <h1>My Courses</h1>
      </div>
      <div class="who">
        <span class="avatar" id="whoAvatar">V</span>
        <span id="whoName">…</span>
        <button class="btn btn-secondary btn-sm" id="logoutBtn">Logout</button>
      </div>
    </div>
    <main class="content" id="mainContent" tabindex="-1">
      <p class="muted" style="margin:0 0 16px">
        Only courses the Main Admin has assigned to you appear here. From here you can
        manage a course's content or view its enrolled students.
      </p>
      <div id="coursesList" aria-live="polite" aria-busy="true"></div>
    </main>
  </div>
</div>

<div id="toasts"></div>
<script src="assets/teacher.js?v=p5"></script>
<script>
(async function () {
  if (!Teacher.requireAuth()) return;
  Teacher.mountSidebar("courses");

  var session = Teacher.getSession();
  var displayName = session.fullName || session.username;
  document.getElementById("whoName").textContent = displayName;
  document.getElementById("whoAvatar").textContent = (displayName || "V").charAt(0).toUpperCase();
  document.getElementById("logoutBtn").addEventListener("click", function () { Teacher.logout(); });

  function fmtDate(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function courseCard(c) {
    var published = c.active === undefined || c.active === null || c.active === true;
    var badge = published
      ? '<span class="badge badge-ok">Published</span>'
      : '<span class="badge badge-warn">Draft</span>';
    var updated = fmtDate(c.updatedAt || c.createdAt);
    return '' +
      '<div class="card mc-card" data-card-id="' + c.id + '">' +
        '<div class="mc-head">' +
          '<div class="mc-icon">' + Teacher.esc(c.icon || "\uD83C\uDF93") + '</div>' +
          '<div>' +
            '<div class="mc-title">' + Teacher.esc(c.title) + '</div>' +
            '<div class="mc-code">' + Teacher.esc(c.code || "") + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="mc-meta">' +
          badge +
          (c.category ? ' &nbsp;•&nbsp; ' + Teacher.esc(c.category) : "") +
          (c.level ? ' &nbsp;•&nbsp; ' + Teacher.esc(c.level) : "") +
        '</div>' +
        '<div class="mc-stats">' +
          '<span data-role="students"><span class="spinner" aria-hidden="true"></span>Students</span>' +
          '<span data-role="lessons"><span class="spinner" aria-hidden="true"></span>Lessons</span>' +
        '</div>' +
        (updated ? '<div class="mc-updated">Last updated ' + updated + '</div>' : "") +
        '<div class="mc-actions">' +
          '<button class="btn btn-secondary btn-sm mc-students" data-id="' + c.id + '">View Students</button>' +
          '<button class="btn btn-primary btn-sm mc-manage" data-id="' + c.id + '">Manage Content</button>' +
        '</div>' +
      '</div>';
  }

  function renderCourses(courses, host) {
    host.innerHTML = '<div class="mc-grid">' + courses.map(courseCard).join("") + '</div>';

    Array.prototype.forEach.call(host.querySelectorAll(".mc-manage"), function (btn) {
      btn.addEventListener("click", function () {
        window.location.href = "course-content.html?courseId=" + encodeURIComponent(btn.getAttribute("data-id"));
      });
    });
    Array.prototype.forEach.call(host.querySelectorAll(".mc-students"), function (btn) {
      btn.addEventListener("click", function () {
        window.location.href = "students.html?courseId=" + encodeURIComponent(btn.getAttribute("data-id"));
      });
    });

    /* Number of students / lessons per course: reuse the existing per-course endpoints
       (no new backend field was invented for this - GET /teacher/courses/{id}/students
       and GET /teacher/courses/{id}/content already carry these counts). */
    courses.forEach(function (c) {
      var card = host.querySelector('.mc-card[data-card-id="' + c.id + '"]');
      if (!card) return;
      var studentsEl = card.querySelector('[data-role="students"]');
      var lessonsEl = card.querySelector('[data-role="lessons"]');

      Teacher.api.get("/teacher/courses/" + c.id + "/students").then(function (list) {
        var n = (list || []).length;
        studentsEl.innerHTML = '<strong>' + n + '</strong> student' + (n === 1 ? "" : "s");
      }).catch(function () { studentsEl.textContent = "— students"; });

      Teacher.api.get("/teacher/courses/" + c.id + "/content").then(function (content) {
        var n = content && typeof content.lessonCount === "number" ? content.lessonCount : 0;
        lessonsEl.innerHTML = '<strong>' + n + '</strong> lesson' + (n === 1 ? "" : "s");
      }).catch(function () { lessonsEl.textContent = "— lessons"; });
    });
  }

  Teacher.load(
    document.getElementById("coursesList"),
    function () { return Teacher.api.get("/teacher/courses"); },
    renderCourses,
    { icon: "\uD83D\uDCDA", title: "No courses assigned yet", message: "Please contact the Main Admin to get a course assigned to your account.", grid: true, count: 3, rowClass: "t-skel-card" }
  );

  window.addEventListener("pageshow", function (e) {
    if (e.persisted && !Teacher.getSession()) {
      window.location.href = "../teacher-login.html";
    }
  });
})();
</script>
</body>
</html>
