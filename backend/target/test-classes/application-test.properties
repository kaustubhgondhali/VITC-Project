spring.datasource.url=jdbc:h2:mem:vitc;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
app.security.encryption-key=test-encryption-key-for-unit-tests
app.security.video-token-key=test-video-token-key-for-unit-tests

# Upload tests use deterministic container-signature fixtures rather than full media streams.
# Production keeps normalization enabled; real FFmpeg conversion is covered by the runtime path.
app.media.ffmpeg-enabled=false

# PART 2A/7 - integration tests legitimately call login/forgot-password many
# times in a row from the same in-JVM "IP"; rate limiting is a production
# concern, not something the test profile should have to work around.
app.rate-limit.enabled=false
