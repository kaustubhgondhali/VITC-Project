spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=warn
logging.level.com.vitc=info

# ===== Payments =====
payment.gateway=${PAYMENT_GATEWAY:mock}
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ===== MySQL Datasource =====
# PART 2A/7 - no insecure fallback in prod: if DB_URL/DB_USERNAME/DB_PASSWORD
# are not set, Spring fails fast at startup with a clear
# "Could not resolve placeholder" error instead of silently falling back to
# the dev-only root/root credentials defined in application.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== Secrets that must not use the dev fallback in production =====
# RAZORPAY_ENCRYPTION_KEY and VIDEO_TOKEN_SECRET are already required reading
# for CryptoService / VideoAccessTokenService: if unset they fall back to a
# fixed, publicly-visible "...-dev-only-...-change-me" string and log a
# warning (see application.properties). That fallback is fine for a laptop,
# never for prod - set both variables before deploying. The same "no
# insecure default" rule is applied here to the seeded admin/teacher
# accounts so a production deployment cannot accidentally boot with the
# well-known Admin@123 / VITC@123 defaults.
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD}
app.teacher.default-password=${TEACHER_DEFAULT_PASSWORD}

# ===== PART 2B-1/7: security headers in production =====
# Enforcing (not report-only) and full HSTS. The site must be served over HTTPS.
app.security.headers.enabled=true
app.security.headers.csp-enabled=true
app.security.headers.csp-report-only=${SECURITY_HEADERS_CSP_REPORT_ONLY:false}
app.security.headers.hsts-enabled=true
app.security.headers.hsts-max-age-seconds=31536000
app.security.headers.hsts-include-sub-domains=true
# Flip to true only once every subdomain is HTTPS-only - preload is irreversible.
app.security.headers.hsts-preload=${SECURITY_HEADERS_HSTS_PRELOAD:false}
