# ===== Application =====
spring.application.name=vitc-backend
server.port=8080
server.servlet.context-path=/

# ===== MySQL Datasource =====
# PART 2A/7 - overridable via DB_URL / DB_USERNAME / DB_PASSWORD so no real
# credentials ever need to live in this file. The defaults below (root/root
# against a local vitc_db) are a local-development convenience only - they
# match a fresh local MySQL install, not any deployed environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vitc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JSON =====
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ===== Uploads =====
app.upload.dir=uploads
app.upload.public-path=/uploads
# PART 5/10: one configurable source for transport limits. Request size includes multipart
# framing, so it is intentionally a little larger than the per-file limit.
app.media.max-file-size=500MB
app.media.max-request-size=520MB
app.media.audio-max-file-size=100MB
# Media conversion is optional. Compatible MP4/MP3/M4A files can pass through when tools are absent.
app.media.ffmpeg-enabled=${MEDIA_FFMPEG_ENABLED:true}
spring.servlet.multipart.max-file-size=${app.media.max-file-size}
spring.servlet.multipart.max-request-size=${app.media.max-request-size}

# ===== CORS (comma separated origins) =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:5500,http://localhost:5500,http://127.0.0.1:8080

# ===== Logging =====
logging.level.org.hibernate.SQL=debug
logging.level.com.vitc=debug

# ===== Swagger / OpenAPI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.default-produces-media-type=application/json

# ===== Default admin (created on first start if missing) =====
# PART 2A/7 - Admin@123 below is a local-dev-only convenience default (same
# pattern as DB_URL/DB_USERNAME/DB_PASSWORD above). Set ADMIN_DEFAULT_PASSWORD
# before first start in any shared/production environment; application-prod.properties
# requires it explicitly and will fail to start without it.
app.admin.default-username=${ADMIN_DEFAULT_USERNAME:admin}
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@vitc.in}
app.admin.default-name=${ADMIN_DEFAULT_NAME:Super Admin}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123}

# ===== Default Teacher Admin (created on first start if missing) =====
# Idempotent: only ever created once. Existing password / must-change-password
# state is never reset by restarting the app. Change these via environment
# variables before first start if you want different default credentials.
app.teacher.default-username=${TEACHER_DEFAULT_USERNAME:VITCteacher}
app.teacher.default-email=${TEACHER_DEFAULT_EMAIL:teacher@vitc.in}
app.teacher.default-name=${TEACHER_DEFAULT_NAME:VITC Teacher}
app.teacher.default-password=${TEACHER_DEFAULT_PASSWORD:VITC@123}

# ===== Payments =====
# Default gateway used ONLY until an admin saves a configuration in
# Admin -> Payment Settings (which is stored in payment_gateway_settings).
# Values: mock | razorpay
payment.gateway=mock
payment.currency=INR
payment.tax-rate=18
# Razorpay credentials are NOT configured here any more. They are entered in
# Admin -> Payment Settings and stored AES-256-GCM encrypted in the database.
payment.razorpay.key-id=
payment.razorpay.key-secret=

# ===== PART 2A/7: Centralized rate limiting (abuse protection) =====
# One filter (RateLimitingFilter) enforces every rule below - nothing is
# duplicated per-controller. Values are "approximately" the stated budgets;
# each is a simple fixed window, not a strict token bucket. Override any of
# these per-environment without touching code.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# Login (student/teacher/admin): ~5 attempts/minute/IP
app.rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW_SECONDS:60}
# Forgot password: ~3 requests/10 minutes/identifier (falls back to IP if no identifier found)
app.rate-limit.forgot-password.max-attempts=${RATE_LIMIT_FORGOT_PASSWORD_MAX:3}
app.rate-limit.forgot-password.window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:600}
# Reset / change password
app.rate-limit.reset-password.max-attempts=${RATE_LIMIT_RESET_PASSWORD_MAX:5}
app.rate-limit.reset-password.window-seconds=${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:600}
# Public write forms (contact message, review submission)
app.rate-limit.public-write.max-attempts=${RATE_LIMIT_PUBLIC_WRITE_MAX:5}
app.rate-limit.public-write.window-seconds=${RATE_LIMIT_PUBLIC_WRITE_WINDOW_SECONDS:600}
# Payment-related (checkout order create/pay/confirm)
app.rate-limit.payment.max-attempts=${RATE_LIMIT_PAYMENT_MAX:10}
app.rate-limit.payment.window-seconds=${RATE_LIMIT_PAYMENT_WINDOW_SECONDS:600}

# ===== Secret encryption =====
# Master key used to encrypt/decrypt the stored Razorpay secrets.
# Set the RAZORPAY_ENCRYPTION_KEY environment variable in every environment;
# without it a development-only fallback key is used and a warning is logged.
app.security.encryption-key=${RAZORPAY_ENCRYPTION_KEY:}

# PART 6C-2A/8: signing key for the short-lived, lesson-scoped video access tokens
# minted by GET /api/v1/student/lessons/{lessonId} and verified by
# GET /api/v1/student/lessons/{lessonId}/video. Set VIDEO_TOKEN_SECRET in every
# environment; without it a development-only fallback key is used and a warning is
# logged (same pattern as app.security.encryption-key above).
app.security.video-token-key=${VIDEO_TOKEN_SECRET:}
# How long a minted video token stays valid. Long enough for a normal viewing
# session (pausing, resuming, seeking); the token is re-minted every time the
# student reopens the lesson, and a revoked enrolment is rejected immediately
# even on a still-unexpired token (see StudentVideoStreamServiceImpl).
app.video.stream-token-ttl-minutes=240

# ---------------------------------------------------------------------------
# Email (student credential emails after a verified Razorpay payment)
# Credentials come from environment variables only - never hard-code them.
# Leave MAIL_HOST empty to disable sending; payments keep working either way.
#
# NOTE: this is only the FALLBACK mail server. The primary source is the
# admin-managed row in the smtp_settings table (Main Admin -> Email / SMTP
# Settings, saved via PUT /api/v1/admin/smtp-settings) - EmailServiceImpl
# reads that table fresh on every send and only falls back to these
# properties when no usable row is saved there yet.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:VITC - Vertex IT Career}
app.mail.support-email=${MAIL_SUPPORT_EMAIL:support@vitc.in}

# Link placed in the credential email (footer -> Student Admin Login page)
app.student.login-url=${STUDENT_LOGIN_URL:http://localhost:5500/student-login.html}

# Public base URL of the frontend site (used to build absolute links in
# outgoing emails, e.g. password reset / course links in later parts).
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5500}

# ===== Purchased assignment delivery =====
# Project packages a Main Admin uploads for paid assignment orders. Deliberately NOT under
# app.upload.dir: everything there is served publicly at /uploads/**, while these files are
# only ever streamed through the buyer's private, token-checked download link.
app.assignment.delivery-dir=${ASSIGNMENT_DELIVERY_DIR:private-uploads/assignment-deliveries}
# How long an emailed download link keeps working. "Resend link" in Admin -> Orders issues a fresh one.
app.assignment.download-link-days=${ASSIGNMENT_DOWNLOAD_LINK_DAYS:30}

# ===== Job Portal applications =====
# Applicants' resumes. Like assignment deliveries, deliberately NOT under app.upload.dir (served
# publicly at /uploads/**): personal documents are only ever streamed to a signed-in Main Admin.
app.job.resume-dir=${JOB_RESUME_DIR:private-uploads/resumes}

# ===== Owner notifications =====
# Who is emailed when someone submits website contact/course enquiries or employer enquiries (comma separated).
# Leave empty to use the business mailbox from Admin -> Email / SMTP Settings (its Reply-To
# address, otherwise its sending address). WhatsApp needs no setting here: the visitor's browser
# opens a click-to-chat link to the number on the site's WhatsApp button.
app.notifications.owner-emails=${OWNER_NOTIFICATION_EMAILS:}

# ===== PART 2B-1/7: HTTP security headers & Content Security Policy =====
# One filter (SecurityHeadersFilter) adds these to EVERY backend response.
# The CSP allow-lists were derived from the actual frontend (Google Fonts,
# Razorpay Checkout, YouTube embeds, Unsplash images). See deploy/SECURITY-HEADERS.md.
app.security.headers.enabled=${SECURITY_HEADERS_ENABLED:true}
app.security.headers.csp-enabled=${SECURITY_HEADERS_CSP_ENABLED:true}
# Set to true to observe violations without blocking anything (rollout mode).
app.security.headers.csp-report-only=${SECURITY_HEADERS_CSP_REPORT_ONLY:false}
app.security.headers.frame-options=${SECURITY_HEADERS_FRAME_OPTIONS:SAMEORIGIN}
app.security.headers.referrer-policy=${SECURITY_HEADERS_REFERRER_POLICY:strict-origin-when-cross-origin}
# HSTS is only ever sent on HTTPS requests, so local http://localhost is never pinned.
app.security.headers.hsts-enabled=${SECURITY_HEADERS_HSTS_ENABLED:true}
app.security.headers.hsts-max-age-seconds=${SECURITY_HEADERS_HSTS_MAX_AGE:31536000}
app.security.headers.hsts-include-sub-domains=${SECURITY_HEADERS_HSTS_SUBDOMAINS:true}
app.security.headers.hsts-preload=${SECURITY_HEADERS_HSTS_PRELOAD:false}
# 'unsafe-inline' is required by the EXISTING pages (inline <script> bootstrap blocks and
# inline style="" attributes) and by Swagger UI. 'unsafe-eval' is NOT required by anything.
app.security.headers.allow-inline-scripts=${SECURITY_HEADERS_ALLOW_INLINE_SCRIPTS:true}
app.security.headers.allow-inline-styles=${SECURITY_HEADERS_ALLOW_INLINE_STYLES:true}
app.security.headers.allow-eval=${SECURITY_HEADERS_ALLOW_EVAL:false}
# Extra origins appended at runtime (comma separated), e.g. the deployed frontend origin
# when the site and the API live on different hosts.
app.security.headers.csp.extra-connect-src=${SECURITY_HEADERS_EXTRA_CONNECT_SRC:}
app.security.headers.csp.extra-script-src=${SECURITY_HEADERS_EXTRA_SCRIPT_SRC:}

# ===== PART 2B-2/7: File upload security (category-specific limits) =====
app.upload.security.enabled=true
app.upload.security.profile-image-max-size=2MB
app.upload.security.gallery-image-max-size=5MB
app.upload.security.course-image-max-size=5MB
app.upload.security.document-max-size=15MB
app.upload.security.video-max-size=500MB
app.upload.security.video-max-size=${app.media.max-file-size}
app.upload.security.audio-max-size=${app.media.audio-max-file-size}
app.upload.security.assignment-delivery-max-size=${ASSIGNMENT_DELIVERY_MAX_SIZE:200MB}
app.upload.security.resume-max-size=${RESUME_MAX_SIZE:5MB}
app.media.ffmpeg-enabled=true
app.media.ffmpeg-binary=ffmpeg
app.media.ffprobe-binary=ffprobe
app.media.transcode-timeout-seconds=900
app.upload.security.content-inspection-enabled=true
app.upload.security.allow-svg=true

# ===== Gmail via Google OAuth 2.0 ("Connect Google Account" - no App Password) =====
# All three come from an OAuth 2.0 "Web application" client in Google Cloud Console and are read
# from the environment or backend/.env - never commit real values. The redirect URI must be listed
# character-for-character under the client's "Authorized redirect URIs". Leave the client id empty
# to hide the feature; the SMTP / App Password configuration keeps working either way.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/public/email/google/callback}
