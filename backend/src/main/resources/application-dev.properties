spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Payments =====
payment.gateway=mock

# ===== PART 2B-1/7: security headers in local development =====
# Headers stay on (so CSP problems surface early), but nothing here forces HTTPS:
# HSTS is skipped automatically on plain-HTTP requests.
app.security.headers.enabled=true
app.security.headers.csp-enabled=true
app.security.headers.csp-report-only=${SECURITY_HEADERS_CSP_REPORT_ONLY:false}
